# ============================================================================
# Vela AI — Fly.io Deployment Configuration
# ============================================================================
# Usage:
#   fly launch   (first time)
#   fly deploy   (after config is set)
#   fly secrets set KEY=VALUE ...  (set environment variables)
# ============================================================================

app = "vela-ai-api"
primary_region = "hkg"

[build]
  dockerfile = "Dockerfile"

[[services]]
  protocol = "tcp"
  internal_port = 8000

  [[services.ports]]
    port = 80
    handlers = ["http"]
  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.http_checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    method = "get"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
